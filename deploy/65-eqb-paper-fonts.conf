<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- eqb: map Windows/macOS paper font names (exam-paper-format-standards
       font stacks) to fonts actually installed on this Ubuntu host.
       CN serif 宋体族 -> Noto Serif CJK SC; CN sans 黑体族 -> Noto Sans CJK SC.
       Times New Roman -> Liberation Serif comes from the standard
       30-metric-aliases.conf once fonts-liberation is installed. -->
  <alias binding="strong"><family>SimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Songti SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>STSong</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>SimHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>黑体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Heiti SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>STHeiti</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
</fontconfig>
