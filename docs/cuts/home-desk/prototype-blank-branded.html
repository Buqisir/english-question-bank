<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 D+ · 大搜索框 × 品牌符号（可切换）</title>
<style>
  :root {
    --brand-teal: #2C6E56; --teal-50: #EAF1ED; --teal-100: #CFE4DA;
    --teal-200: #A5CDBD; --teal-800: #1E4A3A;
    --seal-red: #B3402E;
    --bg: #F6F6F4; --surface: #FFFFFF; --surface-2: #EDEDEA;
    --ink: #1E1E1C; --ink-muted: #6A6A64; --ink-faint: #9A9A93;
    --border-subtle: #E8E8E4; --border: #D8D8D2; --border-strong: #C6C6C0;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column;
  }

  .topbar { display: flex; justify-content: flex-end; gap: 4px; padding: 14px 24px; }
  .topbar a {
    font-size: 13px; color: var(--ink-muted); text-decoration: none;
    padding: 5px 10px; border-radius: 6px;
    transition: background 140ms ease, color 140ms ease;
  }
  .topbar a:hover { background: rgba(30,30,28,0.05); color: var(--ink); }

  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 24px; }
  .stage-inner {
    width: 100%; max-width: 720px; margin-top: 20vh;
    transition: margin-top 340ms var(--ease-out);
  }
  body[data-searching] .stage-inner { margin-top: 7vh; }

  /* ── 品牌区：符号 + 字标 ── */
  .brand-block { text-align: center; margin-bottom: 28px; }
  .emblem { display: none; margin: 0 auto 18px; }
  .emblem svg { display: block; margin: 0 auto; }

  /* 印章：微微手钤的歪 */
  .emblem-seal { transform: rotate(-2.5deg); }
  body[data-emblem="seal-teal"] .emblem-seal,
  body[data-emblem="seal-red"] .emblem-seal { display: block; }
  .emblem-seal .seal-body { fill: var(--brand-teal); }
  body[data-emblem="seal-red"] .emblem-seal .seal-body { fill: var(--seal-red); }

  body[data-emblem="cat"] .emblem-cat { display: block; }

  .wordmark { font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
  .wordmark span { color: var(--brand-teal); }
  body[data-emblem="seal-red"] .wordmark span { color: var(--seal-red); }
  .brand-sub {
    margin-top: 6px; font-size: 12px; color: var(--ink-muted);
    letter-spacing: 0.14em; text-transform: uppercase;
  }

  .searchbox {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 14px; padding: 0 10px 0 22px; height: 66px;
    box-shadow: 0 1px 2px rgba(30,30,28,0.04), 0 16px 40px -16px rgba(30,30,28,0.12);
    transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms var(--ease-out);
  }
  .searchbox:focus-within {
    border-color: var(--brand-teal); transform: translateY(-1px);
    box-shadow: 0 0 0 3px var(--teal-50), 0 20px 48px -18px rgba(44,110,86,0.22);
  }
  .searchbox svg { flex: none; color: var(--ink-faint); }
  .searchbox input {
    flex: 1; border: none; outline: none; background: none;
    font: inherit; font-size: 18px; color: var(--ink); min-width: 0;
  }
  .searchbox input::placeholder { color: var(--ink-muted); }
  .search-go {
    flex: none; width: 46px; height: 46px; border: none; border-radius: 10px;
    background: var(--brand-teal); color: #fff; font-size: 18px; cursor: pointer;
    transition: background 140ms ease, transform 100ms ease;
  }
  .search-go:hover { background: var(--teal-800); }
  .search-go:active { transform: scale(0.96); }

  .whisper {
    text-align: center; margin-top: 18px;
    font-size: 13px; color: var(--ink-muted);
    transition: opacity 200ms ease;
  }
  body[data-searching] .whisper { opacity: 0; }

  .results { width: 100%; max-width: 720px; margin: 44px auto 60px; display: none; }
  body[data-searching] .results { display: block; animation: rise 220ms var(--ease-out); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .results-note { font-size: 13.5px; color: var(--ink-muted); margin: 0 4px 14px; }
  .result-row {
    display: flex; align-items: baseline; gap: 16px;
    background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; cursor: pointer;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }
  .result-row:hover { border-color: var(--teal-200); box-shadow: 0 4px 16px -8px rgba(30,30,28,0.10); }
  .result-year { font-size: 19px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .result-main { flex: 1; }
  .result-title { font-size: 15px; font-weight: 600; }
  .result-reason { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
  .result-hit { font-size: 12.5px; color: var(--teal-800); background: var(--teal-50); border-radius: 999px; padding: 3px 10px; }

  /* ── 符号切换器（原型专用）── */
  .switcher {
    position: fixed; right: 14px; bottom: 12px;
    display: flex; align-items: center; gap: 4px;
    background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: 8px; padding: 4px 6px;
  }
  .switcher span { font-size: 11px; color: var(--ink-faint); margin-right: 2px; }
  .switcher button {
    font-family: inherit; font-size: 12px; color: var(--ink-muted);
    background: none; border: none; border-radius: 5px; padding: 4px 9px; cursor: pointer;
  }
  .switcher button:hover { background: rgba(30,30,28,0.05); color: var(--ink); }
  .switcher button[aria-pressed="true"] { background: var(--teal-50); color: var(--teal-800); font-weight: 500; }

  .proto-tag {
    position: fixed; left: 14px; bottom: 12px; font-size: 11px; color: var(--ink-faint);
    background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 3px 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body data-emblem="seal-teal">
  <header class="topbar">
    <a href="#">个人空间</a><a href="#">管理</a><a href="#">qa-local-owner</a><a href="#">退出</a>
  </header>

  <main class="stage">
    <div class="stage-inner">
      <div class="brand-block">
        <!-- 印章：方寸「题」字，社标档位 —— 盖章为真 -->
        <div class="emblem emblem-seal">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <rect class="seal-body" x="2" y="2" width="60" height="60" rx="9"/>
            <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
                  font-family="'Kaiti SC','STKaiti','KaiTi',Songti SC,serif" font-size="40" fill="#FFFFFF">题</text>
          </svg>
        </div>
        <!-- 书猫：线描伏在书上的猫，藏书票档位 -->
        <div class="emblem emblem-cat">
          <svg width="84" height="64" viewBox="0 0 84 64" fill="none" aria-hidden="true">
            <!-- 两本书 -->
            <rect x="10" y="46" width="64" height="7" rx="1.5" stroke="#1E1E1C" stroke-width="1.6"/>
            <rect x="16" y="38" width="52" height="7" rx="1.5" stroke="#2C6E56" stroke-width="1.6"/>
            <!-- 卧猫：背弧 + 头 + 耳 + 尾 -->
            <path d="M24 38 C 26 24, 44 22, 52 28 C 55 30, 58 33, 58 38"
                  stroke="#1E1E1C" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="54" cy="29" r="6.5" stroke="#1E1E1C" stroke-width="1.7"/>
            <path d="M49.5 24.5 L 48.5 20.5 L 52 22.5 M 56 22.5 L 59.5 20.5 L 58.5 24.5"
                  stroke="#1E1E1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 38 C 18 38, 16 33, 19 30"
                  stroke="#1E1E1C" stroke-width="1.7" stroke-linecap="round"/>
            <!-- 闭眼 -->
            <path d="M51.5 29.5 q 1.2 1 2.4 0 M 55.6 29.5 q 1.2 1 2.4 0"
                  stroke="#1E1E1C" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="wordmark">英语题库<span>工作台</span></h1>
        <div class="brand-sub">English Question Bank</div>
      </div>

      <div class="searchbox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="找一篇讲生态恢复的阅读 C，主旨概括" autocomplete="off" autofocus>
        <button class="search-go" aria-label="开始取题">→</button>
      </div>
      <p class="whisper">34 套卷 · 278 篇章，一句话描述你要的题</p>
    </div>

    <section class="results" aria-live="polite">
      <p class="results-note">已按本地题库精确信息匹配。</p>
      <div class="result-row">
        <span class="result-year">2025</span>
        <span class="result-main">
          <span class="result-title">新课标Ⅰ卷 · Reading C</span>
          <div class="result-reason">推荐理由：讲生态恢复的 C 篇 · 主旨概括 T10</div>
        </span>
        <span class="result-hit">命中 1 个篇章</span>
      </div>
      <div class="result-row">
        <span class="result-year">2024</span>
        <span class="result-main">
          <span class="result-title">新课标Ⅱ卷 · Reading D</span>
          <div class="result-reason">推荐理由：可能与生态环境相关的 D 篇</div>
        </span>
        <span class="result-hit">命中 1 个篇章</span>
      </div>
      <div class="result-row">
        <span class="result-year">2023</span>
        <span class="result-main">
          <span class="result-title">全国乙卷 · Reading C</span>
          <div class="result-reason">推荐理由：讲人与自然的 C 篇</div>
        </span>
        <span class="result-hit">命中 1 个篇章</span>
      </div>
    </section>
  </main>

  <div class="switcher" role="group" aria-label="符号档位切换">
    <span>符号</span>
    <button data-set="seal-teal" aria-pressed="true">印章 · 墨绿</button>
    <button data-set="seal-red">印章 · 朱砂</button>
    <button data-set="cat">书猫 · 线描</button>
    <button data-set="none">纯字标</button>
  </div>

  <span class="proto-tag">原型 D+ · 大搜索框 × 品牌符号 · 2026-07-14</span>

<script>
  const q = document.getElementById('q');
  function sync() {
    document.body.toggleAttribute('data-searching', q.value.trim().length > 0);
  }
  q.addEventListener('input', sync);
  q.addEventListener('keydown', (e) => { if (e.key === 'Escape') { q.value = ''; sync(); } });

  document.querySelectorAll('.switcher button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.body.dataset.emblem = btn.dataset.set;
      document.querySelectorAll('.switcher button').forEach((other) =>
        other.setAttribute('aria-pressed', String(other === btn)));
    });
  });
</script>
</body>
</html>
