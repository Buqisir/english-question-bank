<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NS;font-weight:400;src:url(FONTS_SERIF/noto-serif-sc-chinese-simplified-400-normal.woff2)}
@font-face{font-family:NS;font-weight:900;src:url(FONTS_SERIF/noto-serif-sc-chinese-simplified-900-normal.woff2)}
@font-face{font-family:NS;font-weight:700;src:url(FONTS_SERIF/noto-serif-sc-chinese-simplified-700-normal.woff2)}
:root{--bg:#DDF1E8;--ink:#1B231E;--deep:#2C6E56;--kick:#3F7F68}
*{margin:0;box-sizing:border-box}
body{width:1500px;height:2000px;position:relative;overflow:hidden;background:var(--bg);font-family:"Liberation Serif",NS,serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:url(R1.png) center/cover}
.fadeTop{position:absolute;left:0;right:0;top:0;height:760px;background:linear-gradient(var(--bg) 0,var(--bg) 62%,rgba(221,241,232,0))}
.fadeBot{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(rgba(221,241,232,0),rgba(221,241,232,.94) 45%,var(--bg))}
.kicker{position:absolute;left:135px;top:150px;font:400 40px NS;color:var(--kick);letter-spacing:2px}
h1{position:absolute;left:132px;top:220px;font:900 132px/1.18 NS;letter-spacing:2px}
h1 em{font-style:normal;color:var(--deep)}
.sub{position:absolute;left:135px;top:556px;font:400 40px NS;color:#4A564F}
.sub b{font-family:"Liberation Serif";font-weight:400}
.cta{position:absolute;right:135px;bottom:200px;background:var(--deep);color:#fff;border-radius:999px;font:700 42px NS;padding:20px 40px;box-shadow:0 14px 34px rgba(30,70,55,.3)}
.cta span{margin-left:12px;font-family:"Liberation Serif"}
.foot{position:absolute;left:135px;right:135px;bottom:96px;display:flex;justify-content:space-between;font:400 36px NS;color:var(--kick)}
</style></head><body>
<div class="bg"></div><div class="fadeTop"></div>
<div class="kicker">獭石试题解析 · 全卷逐题讲</div>
<h1>一份真题解析，<br><em>应该长这样。</em></h1>
<div class="sub"><b>2025</b> 新课标 <b>II</b> 卷 · <b>2026</b> 全国 <b>II</b> 卷 · 每份 <b>22</b> 页</div>
<div class="fadeBot"></div>
<div class="cta">右滑，看 6 个亮点<span>→</span></div>
<div class="foot"><span>獭石题库</span><span>高考英语真题解析　<span style="font-family:'Liberation Serif'">1/8</span></span></div>
</body></html>
