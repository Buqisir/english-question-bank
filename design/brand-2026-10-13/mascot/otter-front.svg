<!-- 海獭母版（2026-10-13，Owner 选 D2 和往白 ½，BRAND.md §7 第 27、28 条）：形体是 Astra 第 2 轮的 S+，宽鼻、侧耳、短而扁的尾巴、带趾的后脚，F2 仰躺漂着；基础形象空手，前爪收在胸前。毛色是 D2：头、耳朵、喉咙、胸口和肚子连成一片沙白 #E9DDC5，竹青 #3D8F70 只留在背、手臂、尾巴和脚上。口鼻两层：外圈米白 #EEE5D0（muzzle，用头的轮廓裁出），里面暖米白 #F6EFE0（face）。墨 #191D18 给墨点眼（e5）、宽鼻和胡须点（每颊三个排成 ∴，A2）。water 是两条水线，可以单独隐藏。规范见 BRAND.md §4.2。 -->
