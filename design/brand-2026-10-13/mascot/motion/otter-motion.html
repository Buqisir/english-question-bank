<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>獭獭动效 · 转石头、眨眼、浮上来</title>
<!--
  BRAND.md §4.6 第 2 轮（第 65 条）。一次出场只演一个动作，演完就停，不循环；动作在 otter-motion.js。
  - 01 空闲 · 转石头：出场停一拍（300ms），右爪带着石头绕左爪托住的那一点转 -10°（220ms），
    停 120ms，转回来（220ms），一次。石头外面包一层用肚皮裁切的组，转的时候不盖到左爪。
  - 空态 · 眨一次眼：浮姿 P、裹藻仰躺、直立场景这类自己没有动作的图，出场 600ms 后眨一次：
    合上 80ms、张开 120ms。不定时再眨。
  - 探头 · 浮上来：03 待确认、05 没找到、登录页 SL。整只从卡片边后面浮上来（260ms，缓入缓出，不回弹），
    快到位时两只爪和手里的东西从边上搭下来（120ms）。不先停拍，不眨眼。
  - 02 找题中照「正在想」（thinking-dive.html）；04 完成不动。
  - 减少动态效果时什么都不演，直接是最后那一帧。
  这是样例；网站代码没改，上线另开 UI 任务。
-->
<style>
  body { margin: 0; background: #F3F6F0; color: #191D18; font: 14px/1.5 Inter, "PingFang SC", system-ui, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 32px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .lede { margin: 4px 0 0; color: #60665C; font-size: 13px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel p.note { margin: 0; font-size: 12px; color: #60665C; max-width: 340px; }
  .scene { position: relative; }
  .card { position: relative; z-index: 1; background: #FAFCF8; border-radius: 12px; box-shadow: 0 0 0 1px rgba(30,30,28,0.05), 0 1px 2px rgba(30,30,28,0.06); }
  .empty { width: 340px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .empty p { margin: 0; font-size: 13px; color: #60665C; }
  .empty svg { display: block; }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: #191D18; color: #fff; font: inherit; font-size: 13px; }
  .login { width: 340px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .login b { font-size: 14px; }
  .field { height: 36px; border-radius: 8px; background: #FAFDF7; box-shadow: inset 0 0 0 1px #D5DACF; }
  .result { width: 520px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .result b { font-size: 14px; font-weight: 500; }
  .line { height: 8px; border-radius: 999px; background: #E5EAE1; }
  .nf { width: 520px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nf b { font-size: 14px; font-weight: 500; }
  .nf span { font-size: 13px; color: #60665C; }
  .peek { position: absolute; pointer-events: none; }
  .peek > svg { display: block; width: 100%; height: 100%; }
  .peek.back { z-index: 0; }
  .peek.front { z-index: 2; }
  .replay { align-self: flex-start; height: 28px; padding: 0 12px; border: 1px solid #D5DACF; border-radius: 999px; background: #FAFCF8; color: #191D18; font: inherit; font-size: 13px; cursor: pointer; }

  [data-otter="stone"], [data-otter="stone-paw"] { transform-box: view-box; transform-origin: 340px 352px; }
  [data-otter="eye"] { transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>獭獭动效 · 第 2 轮</h1>
    <p class="lede">一次出场只演一个动作，演完就停。点「再演一次」重放；系统打开「减少动态效果」时什么都不演。</p>
  </header>

  <div class="row">
    <section class="panel" data-demo="stone">
      <h2>01 空闲 · 转石头</h2>
      <div class="scene"><div class="card empty" id="empty-01"><p>还没有内容。</p><button class="btn" type="button">去找题</button></div></div>
      <p class="note">停一拍，右爪带着石头转过去、再转回来，一次。眼睛不跟。</p>
      <button class="replay" type="button">再演一次</button>
    </section>
    <section class="panel" data-demo="blink">
      <h2>空态 · 眨一次眼</h2>
      <div class="scene"><div class="card empty" id="empty-kelp"><p>试卷导出为 PDF 后，可以保存在这里。</p><button class="btn" type="button">去找题</button></div></div>
      <p class="note">自己没有动作的图，出场 600ms 后眨一次。不定时再眨。</p>
      <button class="replay" type="button">再演一次</button>
    </section>
  </div>

  <div class="row">
    <section class="panel" data-demo="login">
      <h2>登录页 · 浮上来</h2>
      <div class="scene" style="padding-top:160px"><div class="card login" id="login-card"><b>英语题库工作台</b><div class="field"></div><div class="field"></div><button class="btn" type="button">登录</button></div></div>
      <p class="note">从卡片边后面浮上来，两只爪最后搭上边。</p>
      <button class="replay" type="button">再演一次</button>
    </section>
    <div class="panel" style="gap:24px">
      <section class="panel" data-demo="offer">
        <h2>03 待确认 · 浮上来</h2>
        <div class="scene" style="padding-top:128px"><div class="card result" id="result-card"><b>A篇 · 失败以后重新振作</b><div class="line" style="width:92%"></div><div class="line" style="width:84%"></div><div class="line" style="width:60%"></div></div></div>
        <button class="replay" type="button">再演一次</button>
      </section>
      <section class="panel" data-demo="nf">
        <h2>05 没找到 · 浮上来</h2>
        <div class="scene" style="padding-top:140px"><div class="card nf" id="nf-card"><b>没找到匹配</b><span>换个说法再试，比如写上年级或题型。</span></div></div>
        <button class="replay" type="button">再演一次</button>
      </section>
    </div>
  </div>
</main>

<script src="otter-motion.js"></script>
<script>
  const make = (id) => document.getElementById(id).content.firstElementChild.cloneNode(true);
  const box = (svg) => svg.getAttribute('viewBox').split(/[ ,]+/).map(Number);

  // 空态：图放在文案上面。01 150px 高；裹藻仰躺按两眼间距和 P@150px 一样大，约 148px 高（§4.7）。
  function putEmpty(cardId, tplId, height) {
    const svg = make(tplId);
    const [, , w, h] = box(svg);
    Object.assign(svg.style, { height: height + 'px', width: (w / h) * height + 'px' });
    const card = document.getElementById(cardId);
    card.insertBefore(svg, card.firstChild);
    return svg;
  }

  // 探头：整只画两份，后一份只露卡片边以上，前一份只露卡片边以下；卡片边落在图高的 edge 比例上。
  function putPeek(cardId, tplId, { height, edge, x }) {
    const card = document.getElementById(cardId);
    const scene = card.parentElement;
    const [, , w, h] = box(make(tplId));
    const width = (w / h) * height;
    const edgePx = Math.round(edge * height);
    const top = card.offsetTop - edgePx;
    const left = x === 'center' ? card.offsetLeft + (card.offsetWidth - width) / 2 : card.offsetLeft + card.offsetWidth - width - x;
    const copies = {};
    for (const side of ['back', 'front']) {
      const holder = document.createElement('div');
      holder.className = 'peek ' + side;
      Object.assign(holder.style, { left: Math.round(left) + 'px', top: top + 'px', width: width + 'px', height: height + 'px' });
      // 后一份多露 2px 到卡片后面；前一份从卡片边上 2px 开始，盖住卡片外圈那道发丝边，
      // 不然那道线会横穿搭在边上的爪子和贝壳。
      holder.style.clipPath = side === 'back' ? 'inset(0 0 ' + (height - edgePx - 2) + 'px 0)' : 'inset(' + (edgePx - 2) + 'px 0 0 0)';
      holder.appendChild(make(tplId));
      scene.appendChild(holder);
      copies[side] = holder;
    }
    return { ...copies, edge: edgePx, overhang: height - edgePx + 2 };
  }

  const s01 = putEmpty('empty-01', 't-01', 150);
  const kelp = putEmpty('empty-kelp', 't-kelp', 148);
  // 卡片边的比例照 §4.4：03 约 0.82，05 约 0.92，登录页 0.93。登录页 SL 166px 高，头心离卡片右边 62px。
  const login = putPeek('login-card', 't-sl', { height: 166, edge: 0.93, x: -6 });
  const offer = putPeek('result-card', 't-03', { height: 150, edge: 0.82, x: 24 });
  const nf = putPeek('nf-card', 't-05', { height: 150, edge: 0.92, x: 'center' });

  const play = {
    stone: () => OtterMotion.turnStone(s01),
    blink: () => OtterMotion.blink(kelp),
    login: () => OtterMotion.surface(login),
    offer: () => OtterMotion.surface(offer),
    nf: () => OtterMotion.surface(nf),
  };
  document.querySelectorAll('[data-demo]').forEach((panel) => {
    panel.querySelector('.replay').addEventListener('click', () => play[panel.dataset.demo]());
  });
  Object.values(play).forEach((f) => f());
</script>
