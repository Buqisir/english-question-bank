<title>獭獭动效 · 「正在想」潜下去、浮上来</title>
<!--
  BRAND.md §4.6「正在想」定 (b) 潜下去、浮上来（第 52 条）。状态 02 的路径原样，只给两颊的上点
  加 class="whisker-top" 和到两个下点中点的位移（--dx / --dy，SVG 用户单位）。
  - 进入「正在想」：先停 300ms，结果在这之前回来就不动；然后上点沿直线沉到两个下点之间，
    220ms（DESIGN motion token slow），缓入缓出，不回弹。两颊各成一行三点，合起来是「……」。
  - 停在省略号上，不循环；进度交给旁边的「正在为…找题…」和骨架屏。
  - 想完、同一张图还在屏上：160ms（base）浮回 ∴。换成 03/04/05 时由换图承担，不先播浮上来。
  - 点不放大、不变色、不闪。prefers-reduced-motion 时不移动，直接换。
-->
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #F3F6F0; color: #191D18; font: 14px/1.5 Inter, "PingFang SC", system-ui, sans-serif; }
  .otter { width: 215px; height: 150px; display: block; }
  .stage { width: 360px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .stage p { margin: 0; font-size: 13px; color: #60665C; }
  button { height: 32px; padding: 0 12px; border: 1px solid #D5DACF; border-radius: 8px; background: #FAFCF8; color: #191D18; font: inherit; font-size: 13px; cursor: pointer; }
  .controls { display: flex; gap: 8px; }

  .whisker-top {
    transform-box: view-box;
    transition: transform 160ms cubic-bezier(0.45, 0, 0.55, 1);
  }
  .is-thinking .whisker-top {
    transform: translate(var(--dx), var(--dy));
    transition-duration: 220ms;
    transition-delay: 300ms;
  }
  @media (prefers-reduced-motion: reduce) {
    .whisker-top, .is-thinking .whisker-top { transition: none; }
  }
</style>

<script>
  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  document.getElementById('think').onclick = () => { stage.classList.add('is-thinking'); status.textContent = '正在为「失败以后重新振作的文章」找题…'; };
