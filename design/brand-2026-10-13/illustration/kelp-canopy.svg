<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.9 14.1 301.8 286.8">
<!-- 林冠透光中图：一块深竹青的水，上沿就是水面，三束米白光从右上斜着照进巨藻林（上窄下宽，出下沿），五株竹青巨藻在光前面，海獭裹着一根巨藻漂在水面上（2026-10-14 主题 9 巨藻林，BRAND.md §5.2，提案）。和 kelp-forest.svg、kelp-dive.svg 不同，它自带一块水色底：米白光在桌面上看不见，必须有深底才成立，所以比另两张重，只给一次性的大品牌位置（240–480px），不进工具界面、不做空态。来源：kelp.svg 和 mascot/kelp/otter-kelp-wrap.svg 原样拼成（巨藻横向压到 0.55），没有另外生成。 -->
  <path id="water" d="M0 92H300V284Q300 300 284 300H16Q0 300 0 284Z" fill="#2C6E56"/>
