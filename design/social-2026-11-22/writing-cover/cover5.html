<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NS;font-weight:400;src:url(FONTS_SERIF/noto-serif-sc-chinese-simplified-400-normal.woff2)}
@font-face{font-family:NS;font-weight:700;src:url(FONTS_SERIF/noto-serif-sc-chinese-simplified-700-normal.woff2)}
@font-face{font-family:NS;font-weight:900;src:url(FONTS_SERIF/noto-serif-sc-chinese-simplified-900-normal.woff2)}
:root{--ink:#1B231E;--green:#3F7F68;--deep:#2C6E56;--mute:#7A857F;--chip:#DDF1E8;--paper:#F2FAF5}
*{margin:0;box-sizing:border-box}
body{width:1500px;height:2000px;position:relative;overflow:hidden;background:var(--paper);font-family:"Liberation Serif",NS,serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:url(T3.png) center/cover}
.fadeTop{position:absolute;left:0;right:0;top:0;height:720px;background:linear-gradient(var(--paper) 0,var(--paper) 60%,rgba(242,250,245,0))}
.kicker{position:absolute;left:135px;top:150px;font:400 40px NS;color:var(--green);letter-spacing:2px}
h1{position:absolute;left:130px;top:220px;font:900 140px/1.16 NS;letter-spacing:2px}
h1 q{quotes:"「" "」";color:var(--deep)}
.sub{position:absolute;left:135px;top:560px;font:400 40px NS;color:#4A564F}
.card{position:absolute;right:90px;top:820px;width:600px;background:#fff;border-radius:30px;padding:40px 44px 44px;box-shadow:0 24px 60px rgba(30,70,55,.16);transform:rotate(2deg)}
.row .lab{display:inline-block;font:400 30px NS;color:var(--mute);margin-bottom:8px}
.row .lab.good{font-weight:900;color:var(--deep)}
.old{font-size:36px;color:#98A29C;text-decoration:line-through;text-decoration-color:rgba(44,110,86,.55);text-decoration-thickness:3px;line-height:1.35}
.new{font-size:38px;line-height:1.42;background:linear-gradient(transparent 58%,var(--chip) 58%);display:inline}
.zh{font:400 28px NS;color:var(--mute);margin-top:10px}
.sep{height:2px;background:#E3EFEA;margin:28px 0}
.tag{position:absolute;left:-18px;top:-28px;font:700 30px NS;color:#fff;background:var(--deep);border-radius:999px;padding:8px 24px;transform:rotate(-4deg);box-shadow:0 8px 20px rgba(30,70,55,.25)}
.cta{position:absolute;right:135px;bottom:190px;background:var(--deep);color:#fff;border-radius:999px;font:700 42px NS;padding:20px 40px;box-shadow:0 14px 34px rgba(30,70,55,.3)}
.cta span{margin-left:12px;font-family:"Liberation Serif"}
.foot{position:absolute;left:135px;right:135px;bottom:90px;display:flex;justify-content:space-between;font:400 38px NS;color:var(--green)}
.foot span span{font-family:"Liberation Serif"}
.footbg{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(rgba(242,250,245,0),rgba(242,250,245,.92) 45%,var(--paper))}
</style></head><body>
<div class="bg"></div><div class="fadeTop"></div>
<div class="kicker">应用文，换一种讲法</div>
<h1>别只写<br><span style="margin-left:-70px"><q>我会尽力</q>。</span></h1>
<div class="sub">给外教 Kate 写邮件：建议配图 + 自荐画图</div>
<div class="card">
  <span class="tag">提高版范文</span>
  <div class="row"><span class="lab">常见写法</span><div class="old">I will try my best to draw them well.</div></div>
  <div class="sep"></div>
  <div class="row"><span class="lab good">这样写</span><div><span class="new">To keep each picture true to its essay, I’ll chat with the writer first.</span></div><div class="zh">为了让每幅画贴合它的文章，我会先和作者聊一聊。</div></div>
</div>
<div class="footbg"></div><div class="cta">右滑，看范文解析<span>→</span></div>
<div class="foot"><span>獭石题库</span><span><span>2026</span> 全国 <span>II</span> 卷　应用文</span></div>
</body></html>
