<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NS;font-weight:400;src:url(FONTS/noto-serif-sc-chinese-simplified-400-normal.woff2)}
@font-face{font-family:NS;font-weight:700;src:url(FONTS/noto-serif-sc-chinese-simplified-700-normal.woff2)}
@font-face{font-family:NS;font-weight:900;src:url(FONTS/noto-serif-sc-chinese-simplified-900-normal.woff2)}
@font-face{font-family:NSL;font-weight:400;src:url(FONTS/noto-serif-sc-latin-400-normal.woff2)}
@font-face{font-family:NSL;font-weight:700;src:url(FONTS/noto-serif-sc-latin-700-normal.woff2)}
@font-face{font-family:NSL;font-weight:900;src:url(FONTS/noto-serif-sc-latin-900-normal.woff2)}
:root{--ink:#3B4D3E;--mute:#6E7A6E;--paper:#F3F4EF;--line:#DCDED6}
*{margin:0;box-sizing:border-box}
body{width:1500px;height:2000px;position:relative;overflow:hidden;font-family:"Liberation Serif",NSL,NS,serif;color:var(--ink);background:var(--paper)}
.bg{position:absolute;inset:0;background:url(C1.png) center/cover}
.fadeTop{position:absolute;left:0;right:0;top:0;height:700px;background:linear-gradient(var(--paper) 0,var(--paper) 62%,rgba(243,244,239,0) 100%)}
.kicker{position:absolute;left:100px;top:108px;font:700 36px NS;color:var(--mute);letter-spacing:2px}
h1{position:absolute;left:96px;top:168px;font:900 132px/1.18 NS;letter-spacing:2px}
.sub{position:absolute;left:100px;top:510px;font:400 40px NS;color:var(--mute)}
.sub b{font-family:"Liberation Serif";font-weight:400}
.card{position:absolute;left:100px;right:100px;top:600px;background:#fff;border-radius:22px;padding:34px 44px;font-size:50px;box-shadow:0 8px 30px rgba(40,60,45,.12);white-space:nowrap}
.hl{background:#E9EBE4;border-radius:6px;padding:0 6px}
.blk{display:inline-block;background:var(--ink);color:#fff;border-radius:12px;padding:2px 26px;font-weight:700;margin:0 4px}
.chip{position:absolute;font-weight:700;box-shadow:0 10px 26px rgba(20,50,35,.22)}
.c1{left:70px;top:1180px;transform:rotate(-8deg);background:var(--ink);color:#fff;border-radius:16px;font-size:64px;padding:6px 34px}
.c2{right:56px;top:1130px;transform:rotate(6deg);background:#fff;border-radius:18px;font-size:54px;padding:14px 30px;border:3px solid var(--ink)}
.c3{left:60px;top:1420px;transform:rotate(5deg);background:#fff;border-radius:16px;font-size:50px;padding:12px 30px;color:#8A938A;font-weight:400}
.c3 u{text-decoration:none;border-bottom:3px solid #9AA39A;padding:0 34px}
.c4{right:70px;top:1290px;transform:rotate(-5deg);background:var(--ink);color:#fff;border-radius:16px;font-size:58px;padding:6px 32px}
.fadeBot{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(rgba(243,244,239,0),var(--paper) 46%)}
.cta{position:absolute;right:100px;bottom:200px;background:var(--ink);color:#fff;border-radius:999px;font:700 46px NS;padding:22px 44px;box-shadow:0 12px 30px rgba(20,50,35,.3);letter-spacing:1px}
.cta span{margin-left:14px;font-family:"Liberation Serif"}
.foot{position:absolute;left:100px;right:100px;bottom:70px;border-top:2px solid var(--line);padding-top:36px;display:flex;justify-content:space-between;font:400 34px NS;color:var(--mute)}
.foot b{font-weight:900;color:var(--ink)}
</style></head><body>
<div class="bg"></div><div class="fadeTop"></div>
<div class="kicker">完形填空，换一种讲法</div>
<h1>答案，<br>就藏在原文里。</h1>
<div class="sub"><b>2025</b> 新课标 <b>I</b> 卷 · <b>15</b> 个空 · <b>3</b> 步找法</div>
<div class="card"><span class="hl">left happily with the vase</span>. <span class="blk">49</span>, <span class="hl">I posted more</span>.</div>
<div class="chip c1">41</div>
<div class="chip c2">Encouraged</div>
<div class="chip c3"><u>46</u></div>
<div class="chip c4">54</div>
<div class="fadeBot"></div>
<div class="cta">右划，看完形新讲法<span>→</span></div>
<div class="foot"><b>獭石试题解析</b><span><span style="font-family:'Liberation Serif'">2025</span> 新课标 <span style="font-family:'Liberation Serif'">I</span> 卷　完形填空</span></div>
</body></html>
