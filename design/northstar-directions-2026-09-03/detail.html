<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Reading C · 英语题库工作台</title>
<style>
:root {
  --page: #F3F5F1;
  --surface: #FFFFFF;
  --surface-2: #E9ECE6;
  --border: #E3E6E0;
  --border-2: #D5D9D2;
  --ink: #1F1F1D;
  --muted: #6B6E68;
  --faint: #9A9D97;
  --identity: #2C6E56;
  --avatar: #366B1D;
  --action: #1F1F1D;
  --action-hover: #3A3A37;
  --danger: #dc2626;
  --focus: #1F1F1D;
  --rest: 0 1px 2px rgba(30, 30, 28, 0.06);
  --float: 0 8px 24px rgba(0, 0, 0, 0.12);
  --paper-shadow: 0 1px 2px rgba(30, 30, 28, 0.10), 0 12px 32px rgba(30, 30, 28, 0.08);
  --ease: 120ms ease;
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--page);
}
button, input { font: inherit; color: inherit; appearance: none; -webkit-appearance: none; }
a { color: inherit; text-decoration: none; }
.vh {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

.app { max-width: 920px; margin: 0 auto; padding: 24px 32px 96px; }

/* ── Top bar (same as home) ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 48px;
  margin-bottom: 24px;
  background: transparent;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
}
.brand-mark {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--identity);
  color: #fff;
  display: grid; place-items: center;
  flex: 0 0 14px;
  overflow: hidden;
}
.brand-mark svg { width: 12px; height: 12px; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav a, .nav .nav-user, .nav .nav-exit {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 8px;
  border-radius: 8px;
  color: var(--muted);
  background: transparent;
  border: 0;
  cursor: pointer;
  font-size: 13px;
}
.nav a:hover, .nav .nav-user:hover, .nav .nav-exit:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.nav svg { width: 14px; height: 14px; flex: 0 0 14px; }
.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--avatar);
  color: #fff;
  display: grid; place-items: center;
  font-size: 12px;
  font-weight: 600;
}

/* ── Back link ── */
.back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--muted);
}
.back:hover { color: var(--ink); }

/* ── 速览头 ── */
.hero { margin-bottom: 0; }
.meta-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 8px;
  font-size: 12px;
  color: var(--muted);
}
.meta-dot::before { content: "·"; margin: 0 2px; }
.kind-real {
  font-size: 12px;
  color: var(--muted);
  background: var(--surface-2);
  border: 0;
  border-radius: 4px;
  padding: 1px 6px;
  line-height: 1.5;
}
.hero-title {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.3;
}
.hero-summary {
  margin: 0 0 8px;
  max-width: 68ch;
  font-size: 13px;
  line-height: 1.6;
  color: var(--muted);
}
.chips-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 0;
}
.chips-row[hidden] { display: none; }
.chip-soft {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  color: var(--ink);
  background: var(--surface-2);
  border: 0;
  border-radius: 4px;
  padding: 2px 8px;
  line-height: 1.5;
}
.type-missing { display: none; }

/* ── Action row ── */
.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
  margin-bottom: 24px;
}
.actions-main { display: flex; align-items: center; flex-wrap: wrap; flex: 1 1 auto; }
.actions-quiet { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-left: 16px; }
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: var(--action);
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}
.btn-primary:hover { background: var(--action-hover); }
.btn-primary svg { width: 16px; height: 16px; flex: 0 0 16px; }
.btn-quiet {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font-size: 13px;
  cursor: pointer;
}
.btn-quiet:hover { background: var(--surface-2); }
.btn-quiet svg { width: 16px; height: 16px; flex: 0 0 16px; color: var(--muted); }
.actions-more { position: relative; margin-left: auto; }
.btn-icon {
  display: inline-grid;
  place-items: center;
  width: 32px; height: 32px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.btn-icon:hover { background: var(--surface-2); color: var(--ink); }
.btn-icon svg { width: 16px; height: 16px; }
.menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 50;
  min-width: 140px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--float);
  display: none;
}
.menu[data-open="true"] { display: block; }
.menu button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--ink); }
.menu button.danger:hover,
.menu button.danger:focus-visible { color: var(--danger); }
.menu button svg { width: 14px; height: 14px; flex: 0 0 14px; }

/* ── Paper sheet ── */
.paper-wrap { position: relative; }
.paper-viewport {
  position: relative;
  background: var(--surface);
  border-radius: 4px;
  box-shadow: var(--paper-shadow);
  overflow: hidden;
}
.paper-viewport[data-expanded="false"] {
  max-height: 300px;
}
.paper-viewport[data-expanded="true"] {
  max-height: none;
  overflow: visible;
}
.paper-label {
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 2;
  font-size: 11px;
  color: var(--muted);
  pointer-events: none;
}
.paper-body {
  padding: 40px 48px;
  font-family: "Times New Roman", Times, "Songti SC", SimSun, serif;
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink);
}
.paper-body > p { margin: 0 0 1em; }
.paper-body > p:last-of-type { margin-bottom: 0; }
.paper-questions { margin-top: 32px; }
.paper-q + .paper-q { margin-top: 16px; }
.paper-q-stem { margin: 0 0 4px; font-weight: 400; }
.paper-opt { margin: 0; padding-left: 0; }
.paper-fade {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 160px;
  background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 45%, #fff 70%, #fff 100%);
  pointer-events: none;
  opacity: 1;
  transition: opacity var(--ease);
}
.paper-viewport[data-expanded="true"] .paper-fade { opacity: 0; }
.paper-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 14px;
  border: 1px solid var(--border-2);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--float);
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
}
.paper-toggle svg { width: 14px; height: 14px; color: var(--muted); }
.paper-toggle-wrap {
  display: flex;
  justify-content: center;
  background: transparent;
  z-index: 3;
  pointer-events: none;
}
.paper-toggle-wrap .paper-toggle { pointer-events: auto; }
.paper-viewport[data-expanded="false"] .paper-toggle-wrap {
  position: absolute;
  left: 0; right: 0; bottom: 16px;
}
.paper-viewport[data-expanded="true"] .paper-toggle-wrap {
  position: sticky;
  bottom: 24px;
  margin-top: 24px;
  padding-bottom: 8px;
  pointer-events: none;
}

/* ── Draft pill ── */
.draft {
  position: fixed;
  right: 24px; bottom: 24px;
  z-index: 80;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 12px;
  background-color: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border-2);
  border-radius: 999px;
  box-shadow: var(--float);
  font-size: 13px;
  cursor: pointer;
}
.draft:hover { background-color: var(--surface-2); }
.draft svg { width: 14px; height: 14px; }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.btn-primary, .btn-quiet, .btn-icon, .paper-toggle, .draft, .menu button, .back {
  transition: background var(--ease), color var(--ease), opacity var(--ease);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>

  "source": {

    "paperName": "2026年新课标Ⅰ卷",
    "region": "全国新课标Ⅰ",
    "sourceType": "real_exam"
  }
}</script>

<script>
const ICO_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>'
const ICO_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'
const ICO_CHEV_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'
const ICO_CHEV_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>'

const detail = JSON.parse(document.getElementById('detail-data').textContent)

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

/* Meta line */
const metaParts = [
  esc(detail.groupTypeLabel),
  `${detail.questionCount} 题`,
]
const kindBadge = detail.kind === '真题'
  ? '<span class="kind-real">真题</span>'
  : (detail.kind === '模拟' ? '' : esc(detail.kind))
document.getElementById('meta-line').innerHTML =
  metaParts.join('<span class="meta-dot"></span>') +
  (kindBadge ? `<span class="meta-dot"></span>${kindBadge}` : '')

document.getElementById('hero-title').textContent = detail.title
document.getElementById('hero-summary').textContent = detail.summary

/* Type chips */
const typeRoot = document.getElementById('type-chips')
if (detail.typeDistributionMissing || !detail.typeDistribution.length) {
  typeRoot.hidden = true
  typeRoot.innerHTML = ''
} else {
  typeRoot.hidden = false
  typeRoot.innerHTML = detail.typeDistribution
    .map(({ label, count }) => `<span class="chip-soft">${esc(label)} ×${count}</span>`)
    .join('')
}

/* Topic chips */
document.getElementById('topic-chips').innerHTML = detail.topicLabels
  .map(({ leaf, path }) => `<span class="chip-soft" title="${esc(path)}">${esc(leaf)}</span>`)
  .join('')

/* Paper body */
const passageHtml = detail.passage.paragraphs.map((p) => `<p>${esc(p)}</p>`).join('')
const questionsHtml = detail.questions.map((q) => {
  const opts = q.options.map((o) => `<p class="paper-opt">${esc(o.label)}. ${esc(o.content)}</p>`).join('')
  return `<div class="paper-q"><p class="paper-q-stem">${esc(q.number)}. ${esc(q.stem)}</p>${opts}</div>`
}).join('')
document.getElementById('paper-body').innerHTML =
  passageHtml + `<div class="paper-questions">${questionsHtml}</div>`

/* Add to draft toggle */
const btnAdd = document.getElementById('btn-add')
const btnAddLabel = document.getElementById('btn-add-label')
const draftLabel = document.getElementById('draft-label')
let inDraft = false

btnAdd.addEventListener('click', () => {
  inDraft = !inDraft
  btnAdd.setAttribute('aria-pressed', String(inDraft))
  btnAdd.querySelector('svg').outerHTML = inDraft ? ICO_CHECK : ICO_PLUS
  btnAddLabel.textContent = inDraft ? '已在草稿卷' : '加入草稿卷'
  draftLabel.textContent = `草稿卷 · ${inDraft ? 1 : 0} 题组`
})

/* More menu */
const btnMore = document.getElementById('btn-more')
const moreMenu = document.getElementById('more-menu')

function closeMenu() {
  moreMenu.dataset.open = 'false'
  btnMore.setAttribute('aria-expanded', 'false')
}

btnMore.addEventListener('click', (e) => {
  e.stopPropagation()
  const open = moreMenu.dataset.open === 'true'
  moreMenu.dataset.open = String(!open)
  btnMore.setAttribute('aria-expanded', String(!open))
})

document.addEventListener('click', (e) => {
  if (!e.target.closest('.actions-more')) closeMenu()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMenu()
})

/* Paper expand/collapse */
const paperViewport = document.getElementById('paper-viewport')
const paperToggle = document.getElementById('paper-toggle')
const paperToggleLabel = document.getElementById('paper-toggle-label')
let expanded = false

paperToggle.addEventListener('click', () => {
  expanded = !expanded
  paperViewport.dataset.expanded = String(expanded)
  paperToggle.setAttribute('aria-expanded', String(expanded))
  paperToggle.querySelector('svg').outerHTML = expanded ? ICO_CHEV_UP : ICO_CHEV_DOWN
  paperToggleLabel.textContent = expanded ? '收起卷面' : '展开卷面'
})

/* Expose for Playwright shots */
window.__detailProto = { setInDraft(v) { if (inDraft !== v) btnAdd.click() }, setExpanded(v) { if (expanded !== v) paperToggle.click() }, openMenu() { moreMenu.dataset.open = 'true'; btnMore.setAttribute('aria-expanded', 'true') }, closeMenu }
</script>
</body>
</html>
