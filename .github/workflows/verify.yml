name: Verify
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Verify PR #{0} head {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || 'Verify' }}

# Stable required jobs: risk changes their work, never whether they run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Select verification from the trusted PR base
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          plan="$RUNNER_TEMP/eqb-verification-plan.json"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
            test -z "$(git status --porcelain)"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git show -s --format=%P "$GITHUB_SHA")" = "$BASE_SHA $HEAD_SHA"
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
            test "$(git rev-parse "$GITHUB_SHA^{tree}")" = "$(git rev-parse "$HEAD_SHA^{tree}")"
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git cat-file -e "$BASE_SHA:scripts/ci-pr-plan.mjs"; then
            trusted="$RUNNER_TEMP/eqb-ci-policy"
            git worktree add --detach "$trusted" "$BASE_SHA"
            node "$trusted/scripts/ci-pr-plan.mjs" "$GITHUB_WORKSPACE" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_SHA" > "$plan"
            git worktree remove "$trusted"
          else
            # Main and the first rollout PR always run Full. Never bootstrap trust from candidate policy.
            node scripts/verify-ci.mjs --plan-json --pack all > "$plan"
          fi
          pack=$(jq -er '.pack' "$plan")
          case "$pack" in all|ui|feature|paper-data|import-paper) ;; *) echo "Invalid trusted pack"; exit 1 ;; esac
          echo "pack=$pack" >> "$GITHUB_OUTPUT"
          cat "$plan"
          { echo '## Verification plan'; echo '```json'; cat "$plan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      - name: Install app dependencies
        run: pnpm -C app install --frozen-lockfile
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Install verification system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg poppler-utils libreoffice-writer imagemagick ghostscript fonts-noto-cjk fonts-liberation sqlite3 unzip zip
          printf '%s\n' \
            '#!/bin/sh' \
            'if [ "${1:-}" = identify ]; then shift; exec /usr/bin/identify "$@"; fi' \
            'exec /usr/bin/convert "$@"' | sudo tee /usr/local/bin/magick >/dev/null
          sudo chmod 755 /usr/local/bin/magick
          policy=$(find /etc/ImageMagick-* -name policy.xml -print -quit)
          if [ -n "$policy" ]; then
            sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' "$policy"
          fi
          magick -version
      - name: Install Chromium
        run: pnpm -C app exec playwright install --with-deps --no-shell chromium
      - name: Run selected verification pack
        env:
          VERIFY_PACK: ${{ steps.plan.outputs.pack }}
        run: pnpm -C app verify:all -- --pack "$VERIFY_PACK" --jobs 2
      - name: Require tracked checkout to remain clean
        run: git diff --exit-code && git diff --cached --exit-code

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      - name: Install app dependencies
        run: pnpm -C app install --frozen-lockfile
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Install Chromium
        run: pnpm -C app exec playwright install --with-deps --no-shell chromium
      - name: Verify draft pagination renderer
        run: node scripts/verify-draft-pagination-renderer.mjs
      - name: Verify draft pagination DOM contract
        run: node scripts/verify-draft-pagination-dom-contract.mjs
      - name: Verify A3 imposition
        run: node scripts/verify-a3-imposition.mjs
      - name: Verify reorder suggestions
        run: node scripts/verify-reorder-suggest.mjs
      - name: Verify grammar-fill browser geometry
        run: node scripts/verify-paper-normalization-grammar-fill-browser.mjs
      - name: Verify golden path
        run: node scripts/smoke-golden-path.mjs
      - name: Require tracked checkout to remain clean
        run: git diff --exit-code && git diff --cached --exit-code
