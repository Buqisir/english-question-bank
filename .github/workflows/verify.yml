name: Verify

# paths-ignore: docs-only pushes (STATUS 落账、cut 记录、根级 md) skip the
# full verify+e2e queue — the jobs take ~1.5min but the runner queue can eat
# 10min+ per docs commit. A commit mixing docs with any code still runs CI
# (skip applies only when ALL changed files match). scripts/README.md is
# deliberately NOT ignored: its verify registration table is enforced by the
# CI housekeeping guard.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # The full registry now includes real browser, PDF-source, and DOCX-source
      # seams. Keep verify:all truthful in CI instead of reporting product
      # failures when the runner is merely missing its declared tools.
      - name: Install verification system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg poppler-utils libreoffice-writer

      - name: Install verification Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      - name: Run app build and core verify scripts
        run: pnpm run verify:all
        working-directory: app

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      # draft-desk-b step4: the draft-paper pagination/PDF pipeline
      # (server/draft-paper/chromiumPool.mjs) launches through server/'s own
      # playwright-core with channel 'chromium'. The app-side install above
      # provisions app's pinned browser revision, which playwright-core does
      # not necessarily share — the smoke's PDF-export step needs the revision
      # server/'s playwright-core resolves.
      - name: Install server pagination Chromium (playwright-core)
        run: npx playwright-core install --with-deps chromium
        working-directory: server

      # draft-desk-b step5 (SW-B): these two need a real server-side Chromium
      # (installed above) that the main verify job's `npm ci` never
      # provisions — the e2e job is the only place that cost is already paid.
      # verify-draft-pagination-perf.mjs deliberately stays out of CI: its
      # absolute-latency assertions are exactly the "易抖动" case plan.md's
      # own Verify 要求 flags as CI-exempt on a shared runner (see
      # scripts/README.md).
      - name: Run draft pagination renderer verify
        run: node scripts/verify-draft-pagination-renderer.mjs

      - name: Run draft pagination DOM contract verify
        run: node scripts/verify-draft-pagination-dom-contract.mjs

      # a3-imposition (plan.md Must Do 5): uses app's own Playwright browser
      # (installed above), not server's playwright-core — doesn't need the
      # "Install server pagination Chromium" step at all, but sits after it
      # anyway to keep this job's Chromium-dependent steps grouped together.
      - name: Run a3 imposition verify
        run: node scripts/verify-a3-imposition.mjs

      # reorder-suggest (docs/cuts/reorder-suggest/plan.md): same Chromium
      # requirements as the two steps above (getDraftPaperPagination via
      # getReorderSuggestion, plus app's Playwright for the click phase) —
      # sits after both, same wiring.
      - name: Run reorder suggest verify
        run: node scripts/verify-reorder-suggest.mjs

      - name: Run grammar-fill PaperSurface geometry verify
        run: node scripts/verify-paper-normalization-grammar-fill-browser.mjs

      - name: Run golden path E2E smoke
        run: node scripts/smoke-golden-path.mjs
